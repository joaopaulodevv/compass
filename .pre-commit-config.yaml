# Python tooling runs through `uv` so that the versions used locally, in CI and in
# pre-commit all come from a single source of truth: apps/api/uv.lock.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (apps/api)
        entry: uv run --directory apps/api ruff format
        language: system
        files: ^apps/api/.*\.pyi?$
        pass_filenames: false

      - id: ruff-check
        name: ruff check (apps/api)
        entry: uv run --directory apps/api ruff check --fix
        language: system
        files: ^apps/api/.*\.pyi?$
        pass_filenames: false

      - id: mypy
        name: mypy (apps/api)
        entry: uv run --directory apps/api mypy
        language: system
        files: ^apps/api/.*\.pyi?$
        pass_filenames: false
