[project]
name = "compass-api"
version = "0.1.0"
description = "Compass application API: AI-powered personal financial assistant."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx2>=2.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compass_api"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "S",    # flake8-bandit
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # FastAPI dependency injection relies on calls in defaults.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are the point of a test suite.
"src/compass_api/migrations/**" = ["I001"]  # Alembic template ordering.

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "compass_api.migrations.*"
# Alembic generates these from a template; strictness here buys nothing.
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires live infrastructure (PostgreSQL) to be reachable.",
]

[tool.coverage.run]
source = ["src/compass_api"]
branch = true
omit = ["src/compass_api/migrations/*"]

[tool.coverage.report]
show_missing = true
